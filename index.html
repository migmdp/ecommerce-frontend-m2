<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Store - Inicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="assents\css\styles.css"> 
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">TechStore</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Inicio</a> 
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="carrito.html">
                                Carrito 
                                <span id="contador-carrito" class="badge bg-success ms-1">0</span> 
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <button id="btn-registro" type="submit" class="btn btn-primary w-1">registrarse</button>
        </nav>
    </header>

    <!--formulario_INICIO-->
    <div id="login-form-card" class="login-card col-12 col-md-2 ">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>

        <form id="formulario">
        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="usuario@correo.com" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="********" required>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="recordar">
            <label class="form-check-label" for="recordar">Recordarme</label>
        </div>

        <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    

        <div class="text-center mt-3">
        <a href="#">¿Olvidaste tu contraseña?</a><br>
        <a href="#">Crear cuenta nueva</a>
        </div>
    </div>
    <!--formulario_FIN-->

    <main class="container my-5">
        <h1 class="text-center mb-4">Descubre la Mejor Tecnología</h1>
        
        <section id="productos" class="row">
            </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2025 TechStore | Contacto: info@techstore.com</p>
        </div>
    </footer>

    <script src="assents\js\javascript.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
