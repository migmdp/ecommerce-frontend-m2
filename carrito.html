<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assents/css/styles.css"> 
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">TechStore</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a> 
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="carrito.html">
                                Carrito 
                                <span id="contador-carrito" class="badge bg-success ms-1">0</span> 
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <h1 class="mb-4">Tu Carrito de Compras</h1>
        
        <section id="listado-carrito" class="row">
            <div class="col-12 col-lg-8">
                <ul class="list-group" id="items-carrito">
                    <li class="list-group-item text-center text-muted">El carrito está vacío.</li>
                </ul>
            </div>
            
            <aside class="col-12 col-lg-4 mt-4 mt-lg-0">
                <div class="card shadow-sm p-3">
                    <h5 class="card-title">Resumen de la Compra</h5>
                    <p class="h4">Total: <span id="total-carrito" class="text-danger fw-bold">$0.00</span></p>
                    
                    <button id="boton-comprar" class="btn btn-success btn-lg mt-3">
                        Comprar y Finalizar Pedido
                    </button>
                    <button id="boton-vaciar" class="btn btn-outline-danger btn-sm mt-2">
                        Vaciar Carrito
                    </button>
                </div>
            </aside>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2025 TechStore | Contacto: info@techstore.com</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="assents/js/javascript.js"></script>

</body>
</html>
